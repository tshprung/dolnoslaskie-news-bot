name: Deploy Dolnoslaskie bot to VM

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: bash -n run.sh run_digest.sh run_weekly_announce.sh setup.sh

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            sudo mkdir -p /opt/dolnoslaskie_news
            sudo chown -R "$USER":"$USER" /opt/dolnoslaskie_news
            REPO_URL="https://x-access-token:${{ github.token }}@github.com/tshprung/dolnoslaskie-news-bot.git"
            if [ ! -d /opt/dolnoslaskie_news/.git ]; then
              git clone "$REPO_URL" /opt/dolnoslaskie_news
            fi
            cd /opt/dolnoslaskie_news
            git remote set-url origin "$REPO_URL"
            # Recover from a stale/raced remote-tracking ref without deleting the repository.
            if ! git fetch origin; then
              echo "Initial fetch failed; retrying after pruning stale origin refs"
              git remote prune origin || true
              git update-ref -d refs/remotes/origin/main || true
              git fetch origin main:refs/remotes/origin/main
            fi
            git checkout main
            # Local VM edits (e.g. to run.sh) must not block deploy.
            # Deploy the exact revision that passed this workflow's tests.
            git reset --hard ${{ github.sha }}
            git clean -fd
            python3 -m venv venv || true
            ./venv/bin/pip install -q -r requirements.txt
            chmod +x run.sh run_digest.sh run_weekly_announce.sh
            echo "Deploy done at $(date)"

