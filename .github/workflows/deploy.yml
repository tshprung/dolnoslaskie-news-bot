name: Deploy Dolnoslaskie bot to VM

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            sudo mkdir -p /opt/dolnoslaskie_news
            sudo chown -R "$USER":"$USER" /opt/dolnoslaskie_news
            REPO_URL="https://x-access-token:${{ github.token }}@github.com/tshprung/dolnoslaskie-news-bot.git"
            if [ ! -d /opt/dolnoslaskie_news/.git ]; then
              git clone "$REPO_URL" /opt/dolnoslaskie_news
            fi
            cd /opt/dolnoslaskie_news
            git remote set-url origin "$REPO_URL"
            git fetch origin
            git checkout main
            # Local VM edits (e.g. to run.sh) must not block deploy.
            git reset --hard origin/main
            git clean -fd
            python3 -m venv venv || true
            ./venv/bin/pip install -q -r requirements.txt
            chmod +x run.sh || true
            echo "Deploy done at $(date)"
